# TLS obrigatorio no broker do compose (ADR-0004): sem porta AMQP em texto claro.
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /certs/ca.pem
ssl_options.certfile = /certs/broker.pem
ssl_options.keyfile = /certs/broker-chave.pem
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
